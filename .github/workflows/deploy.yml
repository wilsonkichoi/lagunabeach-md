name: Deploy to GitHub Pages

# Genericity + build run on every PR and every push to main; deploy runs only on
# push to main. This is the CI that drives every subsequent task's PR to green
# (SPEC §Negative requirements) and the structural genericity gate (ADR 002).
# The fork's deploy.yml is structural reference only — no OG/Playwright/i18n jobs
# (the scaffold has no content pipeline yet; those arrive with the pages that need
# them in later phases).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight run per ref: a new push to a PR (or main) cancels its own stale
# run. Deploys to main serialize under their own ref group; the github-pages
# environment gives the final deploy-race protection.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  genericity:
    name: Genericity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for place-specific strings in src/ and scripts/
        run: bash scripts/ci/check-genericity.sh

  build:
    name: Build
    needs: genericity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Only publish the artifact when we intend to deploy (push to main); PR
      # builds verify the build compiles but produce nothing to deploy.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
