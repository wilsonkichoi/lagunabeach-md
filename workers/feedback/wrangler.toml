# wrangler.toml — the feedback Worker's deploy config.
#
# PLACEHOLDERS ONLY. This file is framework-owned and ships in the template, so it
# carries no site domain, no account id, and no database id (AGENTS.md iron rule 2;
# both machine gates scan workers/). Every real value is supplied at deploy time and
# documented in docs/runbook/DEPLOY.md §Cloudflare Workers:
#
#   - database_id      <- `npx wrangler d1 create <name>` prints it; paste it here in
#                         YOUR instance, which owns this file after adoption.
#   - ALLOWED_ORIGIN   <- your site's origin, e.g. https://kb.example.invalid
#   - IP_HASH_SALT     <- `npx wrangler secret put IP_HASH_SALT` (a secret, never a var)
#
# Free tier only: this framework adds no paid hosting or infra services.

name = "sekai-feedback"
main = "src/index.mjs"
compatibility_date = "2026-07-01"

# Non-secret configuration. ALLOWED_ORIGIN is the single origin the worker accepts;
# it is never `*`, and an unset value makes every request 403 rather than opening the
# endpoint up.
#
# THIS INSTANCE SUPPLIES ALLOWED_ORIGIN AT DEPLOY TIME, NOT HERE:
#
#   npx wrangler deploy --var ALLOWED_ORIGIN:https://<this instance's origin>
#
# DEPLOY.md step 4 says to edit the value below instead, but this file sits inside
# the place-name denylist gate's scan roots (sekai-kb-v1.0.17 added `workers/`), and
# this instance's origin contains its place name — committing it fails
# `scripts/ci/check-genericity.sh`. The `--var` form keeps the checked-in file
# generic and the deployed worker correctly origin-locked. Verify after deploying:
# a POST from another origin must return 403 `origin_not_allowed`.
#
# ⚠️ `--var` IS PER-DEPLOY, NOT PERSISTENT STATE. It overrides `[vars]` for that one
# invocation only. The next `npx wrangler deploy` WITHOUT the flag re-uploads the
# placeholder below, and every submission from the real site starts coming back 403
# with no change in this repository to explain it. Until the framework fix lands,
# never deploy this worker flagless. This is a stopgap, not the design: the durable
# fix generates the effective config from `place.config.ts` at deploy time
# (LB-77 upstream).
[vars]
ALLOWED_ORIGIN = "https://example.invalid"
RATE_LIMIT_MAX = "5"
RATE_LIMIT_WINDOW_SECONDS = "3600"

# `database_id` is a placeholder: replace it with the id `wrangler d1 create` printed
# for your own database. `database_name` must match the database you created.
[[d1_databases]]
binding = "DB"
database_name = "sekai-feedback"
database_id = "778b043c-899b-4072-855d-bae25eacd5b6"
migrations_dir = "migrations"
